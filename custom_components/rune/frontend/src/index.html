<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RUNE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* Base reset + typography cascade. The colour palette lives on
         :root via styles/root-tokens.ts so every Lit shadow root
         inherits it without needing :host/:host-context tricks. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--rune-bg);
        color: var(--rune-text);
        font-family:
          Inter,
          "SF Pro Text",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <rune-app></rune-app>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
