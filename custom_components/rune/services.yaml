send_command:
  name: Send command
  description: Fire a learned IR / RF pulse on a RUNE device.
  fields:
    device_id:
      name: Device
      description: RUNE device to control.
      required: true
      example: "bedroom_fan"
      selector:
        device:
          integration: rune
    command_key:
      name: Command
      description: Key of the PulseCommand to send (e.g. power_on, speed_2, off).
      required: true
      example: "power_on"
      selector:
        text: {}

learn_command:
  name: Learn command
  description: Start a learn session on a RUNE device — capture an IR / RF signal.
  fields:
    device_id:
      name: Device
      description: RUNE device to capture for.
      required: true
      example: "bedroom_fan"
      selector:
        device:
          integration: rune
    command_key:
      name: Command
      description: Key under which to store the captured pulse.
      required: true
      example: "power_off"
      selector:
        text: {}
    timeout_s:
      name: Timeout (s)
      description: How long to wait for the remote signal before giving up.
      required: false
      default: 15
      example: 15
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: "s"
          mode: box